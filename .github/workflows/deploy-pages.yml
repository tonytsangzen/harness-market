# 将 site/ 目录部署到 GitHub Pages
# 在线地址: https://tonytsangzen.github.io/harness-market/
# 首次使用需在仓库 Settings → Pages → Build and deployment → Source 选择 "GitHub Actions"
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/**'
      - 'plugins-inventory.md'
      - 'gh*.json'
      - 'npm_*.json'
      - 'build_data.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh site/data.js from inventory + raw metadata
        # 若 raw 数据或清单比 site/data.js 更新则重新生成,保持线上数据最新
        run: python3 build_data.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
