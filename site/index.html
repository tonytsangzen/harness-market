<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepSeek Harness 插件市场</title>
  <meta name="description" content="DeepSeek Harness (DSH) 生态插件、扩展、任务包与集成工具市场 — 查询、筛选、详情与下载。" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 17l6-6-6-6" />
            <path d="M12 19h8" />
          </svg>
        </div>
        <div class="brand-text">
          <h1 class="brand-title">DeepSeek Harness <span data-i18n="brandMarket">插件市场</span></h1>
          <p class="brand-sub" data-i18n="brandSub">Everything is a Plugin · 查询 / 详情 / 下载</p>
        </div>
      </div>
      <div class="header-stats" id="headerStats" aria-label="统计" data-i18n-aria="statsAria"></div>
      <nav class="lang-switch" role="group" aria-label="Language / 语言">
        <button type="button" class="lang-btn" data-lang="zh" aria-pressed="false">中文</button>
        <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- 工具栏 -->
    <section class="toolbar" aria-label="筛选与搜索" data-i18n-aria="filterAria">
      <div class="search-row">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="M21 21l-4.35-4.35" />
          </svg>
          <input id="searchInput" type="search" placeholder="搜索插件名称、简介、主题标签、作者…" autocomplete="off" spellcheck="false" />
          <button id="clearSearch" class="clear-btn" aria-label="清空搜索" data-i18n-aria="clearSearch" hidden>×</button>
        </div>
        <select id="sortSelect" class="sort-select" aria-label="排序方式" data-i18n-aria="sortLabel">
          <option value="default" data-i18n="sort_default">综合排序</option>
          <option value="stars" data-i18n="sort_stars">星标最多</option>
          <option value="downloads" data-i18n="sort_downloads">下载量最多</option>
          <option value="updated" data-i18n="sort_updated">最近更新</option>
          <option value="name" data-i18n="sort_name">名称 A–Z</option>
        </select>
      </div>

      <div class="filter-row">
        <div class="type-seg" role="tablist" aria-label="类型筛选" data-i18n-aria="typeAria">
          <button class="type-btn active" data-type="all" data-i18n="type_all">全部</button>
          <button class="type-btn" data-type="repo" data-i18n="type_repo">GitHub 仓库</button>
          <button class="type-btn" data-type="package" data-i18n="type_package">npm 包</button>
        </div>
        <div class="category-chips" id="categoryChips" aria-label="分类筛选" data-i18n-aria="catAria"></div>
      </div>

      <div class="result-meta">
        <span id="resultCount"></span>
      </div>
    </section>

    <!-- 卡片网格 -->
    <section id="grid" class="grid" aria-live="polite"></section>

    <!-- 空状态 -->
    <section id="emptyState" class="empty-state" hidden>
      <div class="empty-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7" />
          <path d="M21 21l-4.35-4.35" />
          <path d="M8 11h6" />
        </svg>
      </div>
      <h2 data-i18n="noResultTitle">没有找到匹配的插件</h2>
      <p data-i18n="noResultDesc">试试更换关键词或清除筛选条件。</p>
      <button id="resetFilters" class="ghost-btn" data-i18n="resetFilters">清除所有筛选</button>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span data-i18n="footerSource">数据来源：npm registry 搜索 API 与 GitHub 搜索 API</span>
      <span id="generatedAt"></span>
    </div>
  </footer>

  <!-- 详情弹窗 -->
  <div id="modalBackdrop" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <button id="modalClose" class="modal-close" aria-label="关闭" data-i18n-aria="close">×</button>
      <div id="detailBody" class="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
